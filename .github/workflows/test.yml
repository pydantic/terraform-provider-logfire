# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    paths-ignore:
      - 'README.md'

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

env:
  LOGFIRE_SECRETS_AVAILABLE: ${{ secrets.LOGFIRE_BASE_URL != '' && secrets.LOGFIRE_API_KEY != '' }}

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: latest

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: 'go.mod'
          cache: true
      # We need the latest version of Terraform for our documentation generation to use
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - run: make generate
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'make generate' command and commit."; exit 1)

  # Run acceptance tests in a matrix with Terraform CLI versions
  test:
    # Only run acceptance tests for PRs from the same repo (skips forked PRs)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Terraform Provider Acceptance Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        terraform:
          - '1.8.*'
          - '1.14.*'
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      - name: Check if secrets are available
        id: check-secrets
        run: |
          if [[ -z "${{ secrets.LOGFIRE_BASE_URL }}" || -z "${{ secrets.LOGFIRE_API_KEY }}" ]]; then
            echo "skip_tests=true" >> $GITHUB_OUTPUT
            echo "LOGFIRE secrets not available, skipping acceptance tests"
          else
            echo "skip_tests=false" >> $GITHUB_OUTPUT
            echo "LOGFIRE secrets available, running acceptance tests"
          fi
      - name: Run acceptance tests
        if: steps.check-secrets.outputs.skip_tests == 'false'
        env:
          TF_ACC: "1"
          LOGFIRE_BASE_URL: ${{ secrets.LOGFIRE_BASE_URL }}
          LOGFIRE_API_KEY: ${{ secrets.LOGFIRE_API_KEY }}
        run: go test -v -cover ./internal/provider/
        timeout-minutes: 10
      - name: Skip acceptance tests
        if: steps.check-secrets.outputs.skip_tests == 'true'
        run: echo "Skipping acceptance tests - LOGFIRE secrets not available"
