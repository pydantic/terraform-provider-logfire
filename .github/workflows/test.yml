# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

# A new push to a pull request cancels the older run's jobs, except live acceptance. Each job
# sets its own group so that one can opt out. Runs outside pull requests use the run ID, so
# pushes to main always run and finish.
jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    concurrency:
      group: tests-build-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Verify Go toolchain
        run: test "$(go env GOVERSION)" = go1.27.3
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  generate:
    runs-on: ubuntu-latest
    concurrency:
      group: tests-generate-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      # We need the latest version of Terraform for our documentation generation to use
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: make generate
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'make generate' command and commit."; exit 1)

  # Every Terraform version runs the local tests. Only the newest also runs the
  # live acceptance tests, which use the shared hosted organization's rate limit.
  test:
    name: Terraform Provider Acceptance Tests
    needs: build
    runs-on: ubuntu-latest
    # Setup, the 10-minute local suite and the 15-minute live step must fit, or the job
    # timeout would cut off live acceptance before Terraform's destroy.
    timeout-minutes: 30
    # Cancelling live acceptance would skip Terraform's destroy and leave resources behind, so
    # a new push waits for the job that runs it instead.
    concurrency:
      group: tests-${{ matrix.terraform }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ matrix.terraform != '1.14.*' }}
    strategy:
      fail-fast: false
      matrix:
        terraform:
          - '1.8.*'
          - '1.14.*'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      - name: Run unit and lifecycle tests
        run: go test -v -cover -timeout=10m ./...
      - name: Check if secrets are available
        id: check-secrets
        if: matrix.terraform == '1.14.*'
        run: |
          if [[ -z "${{ secrets.LOGFIRE_API_KEY }}" ]]; then
            echo "skip_tests=true" >> $GITHUB_OUTPUT
            echo "LOGFIRE_API_KEY secret not available, skipping acceptance tests"
          else
            echo "skip_tests=false" >> $GITHUB_OUTPUT
          fi
      - name: Run acceptance tests
        if: steps.check-secrets.outputs.skip_tests == 'false'
        env:
          TF_ACC: "1"
          LOGFIRE_API_KEY: ${{ secrets.LOGFIRE_API_KEY }}
          LOGFIRE_EXPECTED_ORG: "terraform-provider-logfire"
          # Project-pinned credential for API-key acceptance tests. The public
          # API-keys endpoint only delegates scopes the caller holds, and
          # project-bound scopes cannot live on an org-wide key, so OTLP and
          # gateway keys are exercised through this key in the pinned project.
          # Tests skip when it is absent (forks without secrets).
          LOGFIRE_SCOPED_API_KEY: ${{ secrets.LOGFIRE_SCOPED_API_KEY }}
          LOGFIRE_API_KEY_TEST_PROJECT_ID: "e9731857-2b0f-4731-b21d-bbe39cb8540b"
        run: go test -v -cover -timeout=14m -run '^TestAcc' ./internal/provider/
        timeout-minutes: 15
