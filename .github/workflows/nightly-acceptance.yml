# Nightly acceptance coverage to catch Logfire API drift even when this repo has not changed.
name: Nightly Acceptance Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: nightly-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    name: Nightly Terraform Provider Acceptance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: '1.14.*'
          terraform_wrapper: false
      - run: go mod download
      - name: Check nightly credentials
        env:
          LOGFIRE_API_KEY: ${{ secrets.LOGFIRE_API_KEY }}
        run: |
          if [[ -z "${LOGFIRE_API_KEY}" ]]; then
            echo "LOGFIRE_API_KEY secret is required for nightly acceptance coverage"
            exit 1
          fi
      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          LOGFIRE_API_KEY: ${{ secrets.LOGFIRE_API_KEY }}
          LOGFIRE_EXPECTED_ORG: "terraform-provider-logfire"
        run: go test -v -cover ./internal/provider/
        timeout-minutes: 15
      - name: Notify Slack on failure
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          payload=$(printf '{"text":"Nightly acceptance tests failed for %s on %s at %s. <https://github.com/%s/actions/runs/%s|View run>"}' \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_REF_NAME" \
            "$GITHUB_SHA" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_RUN_ID")
          curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
